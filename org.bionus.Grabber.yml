app-id: org.bionus.Grabber
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: Grabber
rename-icon: grabber

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
build-options:
  append-path: /usr/lib/sdk/node20/bin
  env:
    XDG_CACHE_HOME: /run/build/grabber/flatpak-node/cache
    npm_config_cache: /run/build/grabber/flatpak-node/npm-cache
    npm_config_nodedir: /usr/lib/sdk/node20
    npm_config_offline: 'true'
    npm_config_omit: dev

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download

cleanup:
  - /include
  - '*.a'

modules:
  - name: grabber
    subdir: src
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    make-args:
      - gui
    sources:
      - type: git
        url: https://github.com/Bionus/imgbrd-grabber.git
        tag: v7.14.0
        commit: 2cc8b7cd0fd8b198e3a7c8f31f0de1e5626ec1bb
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - generated-sources.json
